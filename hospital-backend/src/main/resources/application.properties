spring.application.name=hospital-backend

# Server
server.port=${SERVER_PORT:8081}

# Database Configuration - use env vars in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Varsha@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT - externalize secret (Base64, min 256 bits for HS256, 512 for HS512)
jwt.secret=${JWT_SECRET:4MkRBHR5CZKivdaSi2NZH80wZLH92UquPLB8Hthe3iis+KKgOi6Sp5ZcmqXqLOw0E6V4007FX60PiU313fxYng==}
jwt.expiration.ms=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.hospital.backend=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=INFO

# CORS
cors.allowed.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
